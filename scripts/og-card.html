<!DOCTYPE html>
<!-- Карточка для соцсетей и поиска по картинкам. Ровно 1200×630 -- этот размер ждут Facebook,
     Telegram, X и предпросмотр Google. Рисуется скриптом scripts/make-og.mjs.

     Устройство: знак посередине и крупно -- он главное украшение и узнаваемость сайта, в углу
     ему не место. Под ним имя и одна короткая строка. Читать в поиске по картинкам никто не
     будет: там решает картинка целиком, за долю секунды. -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0e0f11;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #f0f0f2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; text-align: center;
  }
  /* Свечение ровно за знаком: оно приподнимает его над фоном и не даёт картинке выглядеть
     плоским чёрным прямоугольником в тёмной ленте мессенджера. */
  .halo {
    position: absolute; left: 50%; top: 240px; transform: translate(-50%, -50%);
    width: 900px; height: 900px; border-radius: 50%;
    background:
      radial-gradient(circle, rgba(74,222,158,.13), rgba(74,222,158,0) 45%),
      radial-gradient(circle, rgba(88,184,240,.10), rgba(88,184,240,0) 60%);
  }
  /* Знак -- те же четыре квадрата, что в значке вкладки, только крупно. */
  .prism {
    position: relative; width: 240px; height: 240px; border-radius: 58px; background: #15171c;
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 44px;
  }
  .prism i { border-radius: 18px; display: block; }
  .prism i:nth-child(1) { background: #f5c451; }
  .prism i:nth-child(2) { background: #ec5f7f; }
  .prism i:nth-child(3) { background: #58b8f0; }
  .prism i:nth-child(4) { background: #4ade9e; }

  .word {
    position: relative; margin-top: 44px;
    font-size: 116px; font-weight: 800; letter-spacing: -4px; line-height: 1;
  }
  .line {
    position: relative; margin-top: 22px;
    font-size: 40px; font-weight: 500; letter-spacing: -.3px;
    color: rgba(214,219,230,.78);
  }
</style>
</head>
<body>
  <div class="halo"></div>
  <div class="prism"><i></i><i></i><i></i><i></i></div>
  <div class="word">Opitro</div>
  <!-- Строка подставляется скриптом: на каждом языке своя. -->
  <div class="line" id="line">СТРОКА</div>
</body>
</html>
