<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Фона нет: на вкладке и в выдаче значок стоит на чужом фоне, и чёрная подложка
       выглядела заплаткой.

       ПАЛИТРА «НЕОН», выбрана владельцем 03.09.2026 из шести вариантов. Оттенки прежние,
       узнаваемость сохранена; насыщенность у каждого доведена до предела, светлота держится
       там, где цвет читается сильнее всего. Менять просто: четыре строки ниже.

       ЦВЕТА НАСЫЩЕННЫЕ, А НЕ ПРОСТО ЯРКИЕ. Прежние были светлыми и оттого выглядели
       разбавленными: жёлтый уходил в песочный, зелёный в мятный. Здесь насыщенность на
       пределе, а светлота опущена к середине, где цвет читается сильнее всего. Оттенки
       прежние, узнаваемость сохранена.

       ЗАЗОР МЕЖДУ КВАДРАТАМИ ОБЯЗАТЕЛЕН. Была ошибка: подгоняя числа под целые точки, я
       поставил квадраты вплотную, и они слиплись в одно пятно. Разбивка теперь такая:
       при viewBox в 32 доли и значке в 16 точек одна доля равна половине точки, поэтому
       отступ 2 доли это 1 точка, квадрат 12 долей это 6 точек, зазор 4 доли это 2 точки.
       Все числа чётные, края ложатся на границы пикселей и не размываются.

       Осторожно: двойное тире внутри комментария XML запрещено, с ним браузер считает
       файл сломанным. Проверять разбор, а не глаза. -->
  <rect x="2" y="2" width="12" height="12" rx="2.5" fill="#FFD400"/>
  <rect x="18" y="2" width="12" height="12" rx="2.5" fill="#FF1E5A"/>
  <rect x="2" y="18" width="12" height="12" rx="2.5" fill="#00D4FF"/>
  <rect x="18" y="18" width="12" height="12" rx="2.5" fill="#00E676"/>
</svg>
