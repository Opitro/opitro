<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Фона нет: на вкладке и в выдаче значок стоит на чужом фоне, и чёрная подложка
       выглядела заплаткой.

       ГЕОМЕТРИЯ ПОДОГНАНА ПОД 16 ТОЧЕК, размер значка на вкладке. При viewBox в 32 доли
       каждая доля равна половине точки, поэтому все числа здесь чётные: квадрат в 14 долей
       это ровно 7 точек, отступ в 2 доли ровно 1 точка. Прежние 13 и 17 давали половинки
       точек, края размывались сглаживанием, и цвет разбавлялся прозрачностью: значок
       выглядел бледным. Скругление тоже уменьшено, на 7 точках круглые углы съедают
       заметную долю цвета.

       Осторожно: двойное тире внутри комментария XML запрещено, с ним браузер считает
       файл сломанным. Проверять разбор, а не глаза. -->
  <rect x="2" y="2" width="14" height="14" rx="2.5" fill="#FFD23F"/>
  <rect x="16" y="2" width="14" height="14" rx="2.5" fill="#FF3D7F"/>
  <rect x="2" y="16" width="14" height="14" rx="2.5" fill="#00D9FF"/>
  <rect x="16" y="16" width="14" height="14" rx="2.5" fill="#4ADE9E"/>
</svg>
